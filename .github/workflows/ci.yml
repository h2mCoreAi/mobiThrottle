name: CI

# Runs the test suite and a full PyInstaller build on every push/PR to main so
# breakage is caught before a release tag is cut.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install ruff (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r requirements-lint.lock
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-build.lock

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/test_throttle.py

      - name: PyInstaller build (smoke)
        run: pyinstaller mobithrottle.spec --noconfirm

      - name: Check exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/mobiThrottle/mobiThrottle.exe)) { throw "exe missing" }
          "{0:N1} MB" -f ((Get-ChildItem dist/mobiThrottle -Recurse | Measure-Object Length -Sum).Sum / 1MB)
