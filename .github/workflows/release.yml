name: Build and release Windows app

# Builds mobiThrottle from source on a GitHub-hosted runner with PyInstaller
# (mobithrottle.spec, the same spec anyone can use locally — see BUILD.md),
# signs SLSA build-provenance attestations for the exe and the zip, and
# publishes a GitHub Release whenever a version tag (v*) is pushed.
# Downloaders verify with:  gh attestation verify <zip> --repo h2mCoreAi/mobiThrottle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

# Never cancel a release mid-publish; queue a second tag push instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the release
      id-token: write       # OIDC token for Sigstore signing
      attestations: write   # store the attestation
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-build.lock

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/test_throttle.py

      - name: Build onedir folder
        run: pyinstaller mobithrottle.spec --noconfirm

      - name: Assemble release folder
        shell: pwsh
        run: |
          $releaseDir = "release/mobiThrottle"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          # Onedir: exe + _internal/ must stay together
          Copy-Item "dist/mobiThrottle/*" $releaseDir -Recurse
          Copy-Item "README.md" "$releaseDir/README.md" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$releaseDir/LICENSE.txt" -ErrorAction SilentlyContinue

      - name: Zip and checksum
        id: pkg
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) { $version = "v0.0.0-dev" }
          $zipName = "mobiThrottle-$version-windows.zip"
          Compress-Archive -Path "release/mobiThrottle" -DestinationPath $zipName
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File "$zipName.sha256" -Encoding ascii -NoNewline
          "zip=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance (exe + zip)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/mobiThrottle/mobiThrottle.exe
            ${{ steps.pkg.outputs.zip }}

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobiThrottle-windows
          path: |
            mobiThrottle-*-windows.zip
            mobiThrottle-*-windows.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            mobiThrottle-*-windows.zip
            mobiThrottle-*-windows.zip.sha256
          body: |
            **mobiThrottle** by TheRealKestryl — onedir package. Extract the
            zip, then run `mobiThrottle/mobiThrottle.exe`. Keep the whole
            folder together (`_internal/` is required).

            ### Built by GitHub, verifiable
            This zip was compiled from the source at this tag on a GitHub-hosted
            runner by [`.github/workflows/release.yml`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/release.yml)
            ([run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            No human touched the binary. GitHub signed a build-provenance
            attestation for both the zip and `mobiThrottle.exe`.

            Verify (needs the [GitHub CLI](https://cli.github.com/)):
            ```
            gh attestation verify ${{ steps.pkg.outputs.zip }} --repo ${{ github.repository }}
            gh attestation verify mobiThrottle/mobiThrottle.exe --repo ${{ github.repository }}
            ```
            Check the SHA256 (PowerShell):
            ```
            Get-FileHash ${{ steps.pkg.outputs.zip }} -Algorithm SHA256
            ```
            Expected: `${{ steps.pkg.outputs.sha256 }}` (also in the attached `.sha256`).

            Build it yourself: see `BUILD.md`. Report security issues: see `SECURITY.md`.
